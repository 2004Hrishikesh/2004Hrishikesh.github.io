<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Hrishikesh Muniraju — Portfolio Arena</title>
  <meta name="description" content="Hrishikesh Muniraju's playable portfolio — score from each spot on the court to unlock a project." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,700;0,800;0,900;1,800;1,900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
    { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div id="card">
      <div class="ovr"><b>99</b><span>OVR</span></div>
      <div class="who"><div id="cardName"></div><div id="cardRole"></div></div>
    </div>
    <div id="topbtns">
      <button id="btnList" title="All projects (Tab)">☰ PROJECTS</button>
      <button id="btnMute" title="Mute (M)">SOUND ON</button>
    </div>

    <div id="tag"></div>
    <div id="meter"><div class="zone"></div><div class="fill"></div></div>
    <div id="feedback"></div>
    <div id="callout"></div>
    <div id="prompt"></div>

    <div id="scorebug">
      <div class="team home"><span id="tHome"></span><b id="sHome">98</b></div>
      <div class="team away"><b id="sAway">99</b><span id="tAway"></span></div>
      <div class="clock"><span>4TH</span><b id="clock">2:00</b></div>
      <div class="unlocks"><span>PROJECTS</span><div id="pips"></div></div>
    </div>

    <div id="touch">
      <div id="joy"><i></i></div>
      <button id="btnShoot">SHOOT</button>
    </div>
  </div>

  <div id="intro">
    <div class="introBox">
      <div class="kicker">TONIGHT · LIVE FROM PORTFOLIO ARENA</div>
      <h1 id="introName"></h1>
      <div class="sub" id="introRole"></div>
      <p>Every project is locked behind a signature play. Step on a glowing spot, hold to fill the meter, and release on <em>green</em>.</p>
      <div class="keys">
        <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move</div>
        <div><kbd>SHIFT</kbd> sprint · drive at the rim for a windmill</div>
        <div><kbd>SPACE</kbd> hold &amp; release to shoot · dunk in the paint</div>
      </div>
      <div class="cta">
        <button id="btnStart" class="primary">TIP OFF ▶</button>
        <button id="btnSkip">Skip the game — just show projects</button>
      </div>
    </div>
  </div>

  <div id="modal" class="hidden">
    <div class="cables"><i></i><i></i></div>
    <div class="jumbo"><div id="modalBody"></div></div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
